# ─────────────────────────────────────────────────────────────────────────────
# Sumi House · 墨の家 — Home Assistant theme
# Repo: trozanek/ha-sumi-house · Spec: THEME_SPEC.md · Theme id: sumi_house
#
# Three layers, in this order:
#   1. Tokens        every `sumi-*` key. The only place a raw colour may appear.
#   2. HA variable   every Home Assistant frontend variable, bound to a token via
#      map           var(--sumi-…). Written once; resolves in both modes.
#   3. Styling       the `card-mod-*` blocks at the end (needs card-mod from HACS).
#
# Rules of the file (enforced by scripts/lint_theme.py):
#   • Tokens that differ per mode live ONLY under `modes:`. Nothing else does.
#   • No hex/rgb outside `sumi-*` keys.
#   • Every non-sumi key is a variable verified in home-assistant/frontend
#     (scripts/ha_frontend_variables.txt) or explicitly listed as legacy.
#   • YAML keys omit the leading `--`; references inside values keep it.
# ─────────────────────────────────────────────────────────────────────────────
Sumi House:
  card-mod-theme: Sumi House

  # ═══════════════════════════════════════════════════════════════════════════
  # LAYER 1 · TOKENS — mode-independent
  # ═══════════════════════════════════════════════════════════════════════════

  # Absolute anchors. Identical in both modes; used only to build the tonal
  # ramps below so that “05” is always the darkest step and “95” the lightest,
  # which is what HA's semantic colour layer expects.
  sumi-char: "#14100A"
  sumi-washi: "#FAF7F1"

  # §3.7 typography
  sumi-font-display: "'Zen Old Mincho', serif"
  sumi-font-ui: "'Zen Kaku Gothic New', -apple-system, sans-serif"
  sumi-font-mono: "'IBM Plex Mono', ui-monospace, monospace"

  # Scale — multiplied by HA's user text-size setting so Profile → “Text size”
  # keeps working. `2xs` has no HA counterpart and is used by Layer 3 only.
  sumi-font-size-2xs: "calc(10px * var(--ha-font-size-scale, 1))"
  sumi-font-size-xs: "calc(11px * var(--ha-font-size-scale, 1))"
  sumi-font-size-s: "calc(13px * var(--ha-font-size-scale, 1))"
  sumi-font-size-m: "calc(14px * var(--ha-font-size-scale, 1))"
  sumi-font-size-l: "calc(16px * var(--ha-font-size-scale, 1))"
  sumi-font-size-xl: "calc(20px * var(--ha-font-size-scale, 1))"
  sumi-font-size-2xl: "calc(28px * var(--ha-font-size-scale, 1))"
  sumi-font-size-3xl: "calc(36px * var(--ha-font-size-scale, 1))"
  sumi-font-size-4xl: "calc(48px * var(--ha-font-size-scale, 1))"
  sumi-tracking-label: "0.22em"     # prototype .label; spec proposed 0.12em (docs/PROTOTYPE_DISCREPANCIES.md)
  sumi-tracking-display: "0.02em"

  # §3.8 geometry & motion — radii confirmed against Concepts/sumi-house-mock.html
  # (--r-card: 6px, --r-chip: 4px); the spec's 4px/2px proposal is superseded.
  sumi-radius-card: "6px"
  sumi-radius-control: "4px"
  sumi-gap: "8px"
  sumi-pad-card: "16px"
  sumi-icon-size: "22px"
  sumi-ease: "cubic-bezier(0.22, 1, 0.36, 1)"
  sumi-dur-fast: "180ms"
  sumi-dur-base: "420ms"
  sumi-dur-slow: "900ms"

  # §5.2 grain — the prototype's fractal-noise tile (160px, baseFrequency 0.8,
  # 2 octaves); opacity is a per-mode token. `#` inside the data URI is written
  # %23 or the CSS breaks silently.
  sumi-grain: 'url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27160%27%20height=%27160%27%3E%3Cfilter%20id=%27g%27%3E%3CfeTurbulence%20type=%27fractalNoise%27%20baseFrequency=%270.8%27%20numOctaves=%272%27%20stitchTiles=%27stitch%27/%3E%3CfeColorMatrix%20type=%27saturate%27%20values=%270%27/%3E%3C/filter%3E%3Crect%20width=%27100%25%27%20height=%27100%25%27%20filter=%27url(%23g)%27/%3E%3C/svg%3E")'

  # §5.3 kintsugi — CSS masks. GENERATED by scripts/gen_seams.py (geometry from the prototype).
  # sumi-crack is the bare horizontal vein (header); sumi-seam-N are card shorthands —
  # a card picks one with `--sumi-seam: var(--sumi-seam-N)`; the default is seam 1.
  sumi-crack: 'url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20600%2014%27%20preserveAspectRatio=%27none%27%3E%3Cpath%20d=%27M0%204%20L60%202.5%20120%205%20180%201.5%20240%204%20300%201%20360%204.5%20420%202%20480%205.5%20540%203%20600%204%27%20fill=%27none%27%20stroke=%27%23fff%27%20stroke-opacity=%270.16%27%20stroke-width=%273.5%27%20stroke-linejoin=%27round%27%20stroke-linecap=%27round%27/%3E%3Cpath%20d=%27M0%204%20L60%202.5%20120%205%20180%201.5%20240%204%20300%201%20360%204.5%20420%202%20480%205.5%20540%203%20600%204%27%20fill=%27none%27%20stroke=%27%23fff%27%20stroke-opacity=%271.0%27%20stroke-width=%271.2%27%20stroke-linejoin=%27round%27%20stroke-linecap=%27round%27/%3E%3Cpath%20d=%27M180%201.5%20L198%207%20M360%204.5%20L376%209.5%20M480%205.5%20L494%200.5%27%20fill=%27none%27%20stroke=%27%23fff%27%20stroke-opacity=%270.85%27%20stroke-width=%270.8%27%20stroke-linejoin=%27round%27%20stroke-linecap=%27round%27/%3E%3C/svg%3E")'
  # top edge, full length (default)
  sumi-seam-1: 'url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20600%2014%27%20preserveAspectRatio=%27none%27%3E%3Cpath%20d=%27M0%204%20L60%202.5%20120%205%20180%201.5%20240%204%20300%201%20360%204.5%20420%202%20480%205.5%20540%203%20600%204%27%20fill=%27none%27%20stroke=%27%23fff%27%20stroke-opacity=%270.16%27%20stroke-width=%273.5%27%20stroke-linejoin=%27round%27%20stroke-linecap=%27round%27/%3E%3Cpath%20d=%27M0%204%20L60%202.5%20120%205%20180%201.5%20240%204%20300%201%20360%204.5%20420%202%20480%205.5%20540%203%20600%204%27%20fill=%27none%27%20stroke=%27%23fff%27%20stroke-opacity=%271.0%27%20stroke-width=%271.2%27%20stroke-linejoin=%27round%27%20stroke-linecap=%27round%27/%3E%3Cpath%20d=%27M180%201.5%20L198%207%20M360%204.5%20L376%209.5%20M480%205.5%20L494%200.5%27%20fill=%27none%27%20stroke=%27%23fff%27%20stroke-opacity=%270.85%27%20stroke-width=%270.8%27%20stroke-linejoin=%27round%27%20stroke-linecap=%27round%27/%3E%3C/svg%3E") left top / 100% 14px no-repeat'
  # bottom edge, full length
  sumi-seam-2: 'url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20600%2014%27%20preserveAspectRatio=%27none%27%3E%3Cpath%20d=%27M%200%2011%20L%2045%209%20105%2012%20165%209.5%20225%2012.5%20285%2010%20345%2012%20405%209%20465%2011.5%20525%209.5%20600%2011%27%20fill=%27none%27%20stroke=%27%23fff%27%20stroke-opacity=%270.16%27%20stroke-width=%273.5%27%20stroke-linejoin=%27round%27%20stroke-linecap=%27round%27/%3E%3Cpath%20d=%27M%200%2011%20L%2045%209%20105%2012%20165%209.5%20225%2012.5%20285%2010%20345%2012%20405%209%20465%2011.5%20525%209.5%20600%2011%27%20fill=%27none%27%20stroke=%27%23fff%27%20stroke-opacity=%271.0%27%20stroke-width=%271.2%27%20stroke-linejoin=%27round%27%20stroke-linecap=%27round%27/%3E%3Cpath%20d=%27M%20105%2012%20L%20118%206%20M%20285%2010%20L%20300%205%20M%20465%2011.5%20L%20452%206%27%20fill=%27none%27%20stroke=%27%23fff%27%20stroke-opacity=%270.85%27%20stroke-width=%270.8%27%20stroke-linejoin=%27round%27%20stroke-linecap=%27round%27/%3E%3C/svg%3E") left bottom / 100% 14px no-repeat'
  # left edge, full length
  sumi-seam-3: 'url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2014%20600%27%20preserveAspectRatio=%27none%27%3E%3Cpath%20d=%27M4%200%20L2.5%2060%205%20120%201.5%20180%204%20240%201%20300%204.5%20360%202%20420%205.5%20480%203%20540%204%20600%27%20fill=%27none%27%20stroke=%27%23fff%27%20stroke-opacity=%270.16%27%20stroke-width=%273.5%27%20stroke-linejoin=%27round%27%20stroke-linecap=%27round%27/%3E%3Cpath%20d=%27M4%200%20L2.5%2060%205%20120%201.5%20180%204%20240%201%20300%204.5%20360%202%20420%205.5%20480%203%20540%204%20600%27%20fill=%27none%27%20stroke=%27%23fff%27%20stroke-opacity=%271.0%27%20stroke-width=%271.2%27%20stroke-linejoin=%27round%27%20stroke-linecap=%27round%27/%3E%3Cpath%20d=%27M1.5%20180%20L7%20198%20M4.5%20360%20L9.5%20376%20M5.5%20480%20L0.5%20494%27%20fill=%27none%27%20stroke=%27%23fff%27%20stroke-opacity=%270.85%27%20stroke-width=%270.8%27%20stroke-linejoin=%27round%27%20stroke-linecap=%27round%27/%3E%3C/svg%3E") left top / 14px 100% no-repeat'
  # right edge, full length
  sumi-seam-4: 'url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2014%20600%27%20preserveAspectRatio=%27none%27%3E%3Cpath%20d=%27M%2011%200%20L%209%2045%2012%20105%209.5%20165%2012.5%20225%2010%20285%2012%20345%209%20405%2011.5%20465%209.5%20525%2011%20600%27%20fill=%27none%27%20stroke=%27%23fff%27%20stroke-opacity=%270.16%27%20stroke-width=%273.5%27%20stroke-linejoin=%27round%27%20stroke-linecap=%27round%27/%3E%3Cpath%20d=%27M%2011%200%20L%209%2045%2012%20105%209.5%20165%2012.5%20225%2010%20285%2012%20345%209%20405%2011.5%20465%209.5%20525%2011%20600%27%20fill=%27none%27%20stroke=%27%23fff%27%20stroke-opacity=%271.0%27%20stroke-width=%271.2%27%20stroke-linejoin=%27round%27%20stroke-linecap=%27round%27/%3E%3Cpath%20d=%27M%2012%20105%20L%206%20118%20M%2010%20285%20L%205%20300%20M%2011.5%20465%20L%206%20452%27%20fill=%27none%27%20stroke=%27%23fff%27%20stroke-opacity=%270.85%27%20stroke-width=%270.8%27%20stroke-linejoin=%27round%27%20stroke-linecap=%27round%27/%3E%3C/svg%3E") right top / 14px 100% no-repeat'
  # top edge, entering from the left, 62%
  sumi-seam-5: 'url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20600%2014%27%20preserveAspectRatio=%27none%27%3E%3Cpath%20d=%27M0%204.5%20L70%202%20130%204%20190%201%20250%203.5%20310%205%20370%202%20430%204.5%20490%201.5%20550%204%20600%202.5%27%20fill=%27none%27%20stroke=%27%23fff%27%20stroke-opacity=%270.16%27%20stroke-width=%273.5%27%20stroke-linejoin=%27round%27%20stroke-linecap=%27round%27/%3E%3Cpath%20d=%27M0%204.5%20L70%202%20130%204%20190%201%20250%203.5%20310%205%20370%202%20430%204.5%20490%201.5%20550%204%20600%202.5%27%20fill=%27none%27%20stroke=%27%23fff%27%20stroke-opacity=%271.0%27%20stroke-width=%271.2%27%20stroke-linejoin=%27round%27%20stroke-linecap=%27round%27/%3E%3Cpath%20d=%27M190%201%20L206%206.5%20M430%204.5%20L446%2010%20M550%204%20L538%209%27%20fill=%27none%27%20stroke=%27%23fff%27%20stroke-opacity=%270.85%27%20stroke-width=%270.8%27%20stroke-linejoin=%27round%27%20stroke-linecap=%27round%27/%3E%3C/svg%3E") left top / 62% 14px no-repeat'

  # ═══════════════════════════════════════════════════════════════════════════
  # LAYER 1 · TOKENS — per mode (§3.1–3.5). Same key set in both modes.
  # ═══════════════════════════════════════════════════════════════════════════
  modes:
    dark:
      # Dark palette = the approved prototype (Concepts/sumi-house-mock.html :root).
      # The spec's §3 values are superseded; see docs/PROTOTYPE_DISCREPANCIES.md.
      # surfaces — 墨, the default
      sumi-ground: "#14100A"            # sidebar / header, one step under the view
      sumi-view: "#17130E"              # --char
      sumi-surface: "#211E1A"           # --char-2, card base under the gradients
      sumi-surface-raised: "#292620"    # --char-3
      sumi-line: "#34302A"              # --seam (the prototype's divider colour)
      sumi-muted: "#6E665A"
      # ink
      sumi-ink: "#EFE7D7"               # --washi
      sumi-ink-soft: "#99907F"          # --stone: the prototype's secondary text
      sumi-ink-faint: "#7A7264"
      sumi-ink-disabled: "#5C554A"
      # accents
      sumi-copper: "#C0754A"            # --copper
      sumi-copper-deep: "#8C4E2E"       # --copper-lo
      sumi-copper-glow: "#DE9163"       # --copper-hi: copper as text
      sumi-oak: "#C89F6E"
      sumi-moss: "#8B9678"
      sumi-mizu: "#7E93A0"
      sumi-stone: "#99907F"
      # status — the prototype defines none; alert/caution keep the spec values, ok/info map to moss/mizu
      sumi-alert: "#CF7B6B"
      sumi-caution: "#D4A23F"
      sumi-ok: "#8B9678"
      sumi-info: "#7E93A0"
      # chart depth steps
      sumi-mizu-deep: "#5C7280"         # prototype .bar.w
      sumi-moss-deep: "#66735A"         # prototype .bar.g
      sumi-oak-deep: "#9A7F52"
      sumi-stone-deep: "#5C554A"
      # rgb triplets for HA's `rgb-*` bridge (must match the hex above — linted)
      sumi-copper-rgb: "192, 117, 74"
      sumi-ink-rgb: "239, 231, 215"
      sumi-ink-soft-rgb: "153, 144, 127"
      sumi-surface-rgb: "33, 30, 26"
      sumi-ground-rgb: "20, 16, 10"
      sumi-alert-rgb: "207, 123, 107"
      sumi-caution-rgb: "212, 162, 63"
      sumi-ok-rgb: "139, 150, 120"
      sumi-info-rgb: "126, 147, 160"
      # texture & light — exactly the prototype's .card layers: warm highlight top-left,
      # shadow bottom-right, both pushed one step further so they read at dashboard scale
      sumi-grain-opacity: "0.035"
      sumi-grain-opacity-view: "0.018"
      sumi-card-light: "radial-gradient(140% 120% at 12% -10%, #2D2924 0%, rgba(45, 41, 36, 0) 58%), radial-gradient(130% 140% at 108% 118%, #151210 0%, rgba(21, 18, 16, 0) 55%)"
      sumi-scrim: "rgba(20, 16, 10, 0.66)"
      # prototype ground texture (.planks): charred vertical boards, 96px pitch
      sumi-planks: "repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.28) 0px, rgba(0, 0, 0, 0.28) 1px, transparent 1px, transparent 96px), repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.012) 0px, rgba(255, 255, 255, 0.012) 48px, transparent 48px, transparent 96px)"

    light:
      # §3.2 surfaces — washi day. Still open: no prototype precedent, needs a visual review.
      sumi-ground: "#E6E1D7"
      sumi-view: "#F2EEE6"
      sumi-surface: "#FAF7F1"
      sumi-surface-raised: "#FFFDF8"
      sumi-line: "#D6D0C4"
      sumi-muted: "#A39C90"
      # §3.3 ink
      sumi-ink: "#1E1C19"
      sumi-ink-soft: "#5A544B"
      sumi-ink-faint: "#7A7368"
      sumi-ink-disabled: "#B0A99C"
      # accents — the prototype hues, darkened for washi surfaces
      sumi-copper: "#8C4E2E"
      sumi-copper-deep: "#6B3A20"
      sumi-copper-glow: "#A65F38"
      sumi-oak: "#8A6D3B"
      sumi-moss: "#566338"
      sumi-mizu: "#3F5C6E"
      sumi-stone: "#7A7368"
      # §3.5 status
      sumi-alert: "#9B4437"
      sumi-caution: "#8A6A16"
      sumi-ok: "#566338"
      sumi-info: "#3F5C6E"
      # chart depth steps — the spec gives none for light; derived from the accents
      sumi-mizu-deep: "color-mix(in oklab, var(--sumi-mizu), var(--sumi-char) 30%)"
      sumi-moss-deep: "color-mix(in oklab, var(--sumi-moss), var(--sumi-char) 30%)"
      sumi-oak-deep: "color-mix(in oklab, var(--sumi-oak), var(--sumi-char) 30%)"
      sumi-stone-deep: "color-mix(in oklab, var(--sumi-stone), var(--sumi-char) 30%)"
      # rgb triplets
      sumi-copper-rgb: "140, 78, 46"
      sumi-ink-rgb: "30, 28, 25"
      sumi-ink-soft-rgb: "90, 84, 75"
      sumi-surface-rgb: "250, 247, 241"
      sumi-ground-rgb: "230, 225, 215"
      sumi-alert-rgb: "155, 68, 55"
      sumi-caution-rgb: "138, 106, 22"
      sumi-ok-rgb: "86, 99, 56"
      sumi-info-rgb: "63, 92, 110"
      # §5.2 texture & light — grain halves, light inverts to a cool wash
      sumi-grain-opacity: "0.02"
      sumi-grain-opacity-view: "0.01"
      sumi-card-light: "radial-gradient(140% 120% at 12% -10%, rgba(255, 255, 255, 0.7), transparent 55%), radial-gradient(130% 140% at 108% 118%, rgba(30, 28, 25, 0.06), transparent 50%)"
      sumi-scrim: "rgba(30, 28, 25, 0.4)"
      # boards in daylight: barely-there joints, no dark lines
      sumi-planks: "repeating-linear-gradient(90deg, rgba(30, 28, 25, 0.05) 0px, rgba(30, 28, 25, 0.05) 1px, transparent 1px, transparent 96px), repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.25) 0px, rgba(255, 255, 255, 0.25) 48px, transparent 48px, transparent 96px)"

  # §5.6 per-person identity — aliases, so a fifth person gets a new token
  sumi-person-tomek: "var(--sumi-copper)"
  sumi-person-ania: "var(--sumi-oak)"
  sumi-person-olaf: "var(--sumi-moss)"
  sumi-person-zoja: "var(--sumi-mizu)"

  # ═══════════════════════════════════════════════════════════════════════════
  # LAYER 2 · HA VARIABLE MAP (§4.2) — tokens only from here on
  # ═══════════════════════════════════════════════════════════════════════════

  # ── Text ──────────────────────────────────────────────────────────────────
  primary-text-color: "var(--sumi-ink)"
  secondary-text-color: "var(--sumi-ink-soft)"
  text-primary-color: "var(--sumi-ground)"          # text drawn on primary-color
  text-light-primary-color: "var(--sumi-ground)"    # text drawn on light-primary-color
  disabled-text-color: "var(--sumi-ink-disabled)"

  # ── Core ──────────────────────────────────────────────────────────────────
  primary-color: "var(--sumi-copper)"
  dark-primary-color: "var(--sumi-copper-deep)"
  darker-primary-color: "var(--sumi-copper-deep)"
  light-primary-color: "var(--sumi-oak)"
  accent-color: "var(--sumi-copper)"
  divider-color: "var(--sumi-line)"
  outline-color: "var(--sumi-line)"
  outline-hover-color: "var(--sumi-copper)"
  scrollbar-thumb-color: "var(--sumi-line)"

  # rgb bridge — community cards build rgba() from these; unset ones fall back to Material blue
  rgb-primary-color: "var(--sumi-copper-rgb)"
  rgb-accent-color: "var(--sumi-copper-rgb)"
  rgb-primary-text-color: "var(--sumi-ink-rgb)"
  rgb-secondary-text-color: "var(--sumi-ink-soft-rgb)"
  rgb-text-primary-color: "var(--sumi-ground-rgb)"
  rgb-card-background-color: "var(--sumi-surface-rgb)"
  rgb-error-color: "var(--sumi-alert-rgb)"
  rgb-warning-color: "var(--sumi-caution-rgb)"
  rgb-success-color: "var(--sumi-ok-rgb)"
  rgb-info-color: "var(--sumi-info-rgb)"

  # ── Status ────────────────────────────────────────────────────────────────
  error-color: "var(--sumi-alert)"
  warning-color: "var(--sumi-caution)"
  success-color: "var(--sumi-ok)"
  info-color: "var(--sumi-info)"

  # ── Backgrounds ───────────────────────────────────────────────────────────
  primary-background-color: "var(--sumi-view)"
  secondary-background-color: "var(--sumi-ground)"
  card-background-color: "var(--sumi-surface)"
  clear-background-color: "var(--sumi-surface)"
  ha-card-background: "var(--sumi-surface)"

  # ── Card ──────────────────────────────────────────────────────────────────
  ha-card-border-radius: "var(--sumi-radius-card)"
  ha-card-border-width: "1px"
  ha-card-border-color: "var(--sumi-line)"
  ha-card-box-shadow: "none"                        # concrete does not float
  ha-card-backdrop-filter: "none"                   # no glass
  ha-card-header-color: "var(--sumi-ink)"
  ha-card-header-font-size: "17px"                  # prototype .sect h3
  ha-card-header-font-family: "var(--sumi-font-display)"

  # ── Sidebar & header — both one shade below the view ──────────────────────
  sidebar-background-color: "var(--sumi-ground)"
  sidebar-text-color: "var(--sumi-ink-soft)"
  sidebar-icon-color: "var(--sumi-ink-faint)"
  sidebar-selected-text-color: "var(--sumi-copper-glow)"
  sidebar-selected-icon-color: "var(--sumi-copper)"
  sidebar-menu-button-background-color: "var(--sumi-ground)"
  sidebar-menu-button-text-color: "var(--sumi-ink)"
  app-header-background-color: "var(--sumi-ground)"
  app-header-text-color: "var(--sumi-ink)"
  app-header-border-bottom: "1px solid var(--sumi-line)"
  app-header-edit-background-color: "var(--sumi-surface-raised)"   # default is Material blue-grey
  app-header-edit-text-color: "var(--sumi-ink)"
