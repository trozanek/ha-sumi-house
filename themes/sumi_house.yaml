  # ═══════════════════════════════════════════════════════════════════════════
  # LAYER 3 · STYLING — requires card-mod (HACS). Without it, Layers 1+2 still
  # render correctly; only grain, seams and the mono/unit typography are lost.
  # ═══════════════════════════════════════════════════════════════════════════

  # Injected into hui-root's shadow root. Tabular figures inherit from here into
  # every card and shadow tree, so digits never jitter as values update.
  card-mod-root: |
    :host {
      font-variant-numeric: tabular-nums;
    }
    /* The prototype's signature: one kintsugi crack running under the header. */
    .header {
      box-shadow: none;
      position: relative;
    }
    .header::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -2px;
      height: 14px;
      pointer-events: none;
      background: linear-gradient(90deg,
        var(--sumi-copper-deep) 0%,
        var(--sumi-copper-glow) 45%,
        var(--sumi-copper-deep) 100%);
      -webkit-mask: var(--sumi-crack) center bottom / 100% 14px no-repeat;
      mask: var(--sumi-crack) center bottom / 100% 14px no-repeat;
    }
    /* Prototype tabs: a Mincho kanji before each view name (家 Home · 居 Living room …).
       Keyed by the view's `path:` — set it in the dashboard to one of the names below.
       Views without a match simply show their title. */
    ha-tab-group-tab::part(base)::before {
      font-family: var(--sumi-font-display);
      font-size: 12px;
      opacity: 0.7;
      margin-right: 7px;
      letter-spacing: 0;
    }
    ha-tab-group-tab[data-path="home"]::part(base)::before,
    ha-tab-group-tab[data-path="overview"]::part(base)::before,
    ha-tab-group-tab[data-path="default_view"]::part(base)::before { content: "家"; }
    ha-tab-group-tab[data-path="living"]::part(base)::before,
    ha-tab-group-tab[data-path="living-room"]::part(base)::before { content: "居"; }
    ha-tab-group-tab[data-path="kitchen"]::part(base)::before { content: "台"; }
    ha-tab-group-tab[data-path="dining"]::part(base)::before { content: "食"; }
    ha-tab-group-tab[data-path="bedroom"]::part(base)::before,
    ha-tab-group-tab[data-path="master"]::part(base)::before { content: "寝"; }
    ha-tab-group-tab[data-path="kids"]::part(base)::before,
    ha-tab-group-tab[data-path="olaf"]::part(base)::before,
    ha-tab-group-tab[data-path="zoja"]::part(base)::before { content: "子"; }
    ha-tab-group-tab[data-path="guest"]::part(base)::before { content: "客"; }
    ha-tab-group-tab[data-path="hall"]::part(base)::before,
    ha-tab-group-tab[data-path="entrance"]::part(base)::before { content: "玄"; }
    ha-tab-group-tab[data-path="mezzanine"]::part(base)::before { content: "階"; }
    ha-tab-group-tab[data-path="attic"]::part(base)::before { content: "屋"; }
    ha-tab-group-tab[data-path="pantry"]::part(base)::before { content: "蔵"; }
    ha-tab-group-tab[data-path="laundry"]::part(base)::before { content: "洗"; }
    ha-tab-group-tab[data-path="garage"]::part(base)::before { content: "車"; }
    ha-tab-group-tab[data-path="bathroom"]::part(base)::before,
    ha-tab-group-tab[data-path="wellness"]::part(base)::before,
    ha-tab-group-tab[data-path="sauna"]::part(base)::before { content: "湯"; }
    ha-tab-group-tab[data-path="garden"]::part(base)::before,
    ha-tab-group-tab[data-path="terrace"]::part(base)::before { content: "庭"; }
    ha-tab-group-tab[data-path="energy"]::part(base)::before { content: "電"; }
    ha-tab-group-tab[data-path="media"]::part(base)::before { content: "映"; }
    ha-tab-group-tab[data-path="cameras"]::part(base)::before { content: "目"; }
    ha-tab-group-tab[data-path="system"]::part(base)::before,
    ha-tab-group-tab[data-path="settings"]::part(base)::before { content: "設"; }

  # Injected around the view. The room itself is textured, not only the objects in it.
  card-mod-view: |
    hui-view {
      position: relative;
      isolation: isolate;
      background: var(--sumi-planks), var(--sumi-view);
      font-variant-numeric: tabular-nums;
    }
    hui-view::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background-image: var(--sumi-grain);
      background-size: 160px 160px;
      opacity: var(--sumi-grain-opacity-view);
      pointer-events: none;
    }

  # Applied to every card.
  card-mod-card: |
    /* §5.2 concrete: matte surface lit from the upper left with a shadow falling to
       the lower right (as in the prototype), 1px edge, no float.

       Two tiers of "active", set per card with card_mod templates (see examples/):
         --sumi-active: 1         any running device → the prototype's quiet copper
                                  trace on the frame. Lights, media, mowers, valves…
         --sumi-seam-opacity: 1   reserved for the few major cards whose activity is
                                  the point of the dashboard — sauna heating, solar
                                  producing, hot tub heating. Draws the kintsugi vein
                                  (and implies the frame trace). Not for every tile. */
    ha-card {
      position: relative;
      isolation: isolate;
      background: var(--sumi-card-light), var(--sumi-surface);
      border: 1px solid color-mix(in oklab, var(--sumi-line),
        var(--sumi-copper-deep) calc(max(var(--sumi-active, 0), var(--sumi-seam-opacity, 0)) * 45%));
      border-radius: var(--sumi-radius-card);
      box-shadow: none;
      font-variant-numeric: tabular-nums;
      --mdc-icon-size: var(--sumi-icon-size);
      transition:
        border-color var(--sumi-dur-base) var(--sumi-ease),
        color var(--sumi-dur-base) var(--sumi-ease);
    }
    /* Hover lifts the edge one step toward ink — never toward copper (§2.3). */
    ha-card:hover {
      border-color: color-mix(in oklab, var(--sumi-line), var(--sumi-ink-faint) 45%);
    }
    /* Grain, below content (negative z-index inside the card's own stacking context). */
    ha-card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: inherit;
      background-image: var(--sumi-grain);
      background-size: 160px 160px;
      opacity: var(--sumi-grain-opacity);
      pointer-events: none;
    }
    /* §5.3 kintsugi seam — hero cards only. Always in the DOM; only opacity animates.
       A card ignites it with --sumi-seam-opacity: 1 (card-mod template on its own
       entity) and may pick an edge with --sumi-seam: var(--sumi-seam-N). See examples/. */
    ha-card::after {
      content: "";
      position: absolute;
      inset: -1px;
      z-index: -1;
      border-radius: inherit;
      background: linear-gradient(90deg,
        var(--sumi-copper-deep) 0%,
        var(--sumi-copper-glow) 45%,
        var(--sumi-copper-deep) 100%);
      -webkit-mask: var(--sumi-seam, var(--sumi-seam-1));
      mask: var(--sumi-seam, var(--sumi-seam-1));
      opacity: var(--sumi-seam-opacity, 0);
      transition: opacity var(--sumi-dur-slow) var(--sumi-ease);
      pointer-events: none;
    }
    /* §5.4 card header: display face, lowercase-preserving. */
    ha-card .card-header {
      font-family: var(--sumi-font-display);
      font-size: var(--ha-card-header-font-size);
      font-weight: var(--ha-font-weight-heading);
      letter-spacing: var(--sumi-tracking-display);
      text-transform: none;
      color: var(--sumi-ink);
    }
    /* §5.4 every numeral is mono. Value slots of the stock entity, statistic and
       gauge cards; template/button cards set it themselves via --sumi-font-mono. */
    ha-card .value,
    ha-card ha-gauge {
      font-family: var(--sumi-font-mono);
      font-variant-numeric: tabular-nums;
    }
    /* Units are separate from values: the prototype's .label — mono, 2xs, uppercase, tracked. */
    ha-card .measurement {
      font-family: var(--sumi-font-mono);
      font-size: var(--sumi-font-size-2xs);
      font-weight: var(--ha-font-weight-medium);
      text-transform: uppercase;
      letter-spacing: var(--sumi-tracking-label);
      color: var(--sumi-ink-faint);
    }
    /* §5.8 everything collapses to its end state under reduced motion. */
    @media (prefers-reduced-motion: reduce) {
      ha-card,
      ha-card::after {
        transition: none;
      }
    }

  # §5.7 sidebar: the selected item carries a 2px copper edge rule, not a filled pill.
  card-mod-sidebar: |
    ha-list-item-button.selected::before {
      left: 0;
      right: auto;
      width: 2px;
      border-radius: 0;
      background-color: var(--sumi-copper);
      opacity: 1;
    }
    ha-list-item-button.selected::part(headline) {
      color: var(--sumi-ink);
    }
