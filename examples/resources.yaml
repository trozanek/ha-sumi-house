# Dashboard resources for the custom cards in www/sumi-house/cards/.
# UI mode: Settings → Dashboards → ⋮ → Resources → Add, one entry per card.
# YAML mode: under `lovelace:` in configuration.yaml:
#
# lovelace:
#   mode: yaml
#   resources:
#     - url: /local/sumi-house/cards/sumi-meal-planner.js?v=1
#       type: module
#
# Bump ?v= whenever the file changes so browsers stop serving the cached copy.
# sumi-vessel-shared.js needs no entry of its own — the vessel cards import it by
# relative URL, and the browser fetches it as part of loading the card module.
resources:
  - url: /local/sumi-house/cards/sumi-sauna-card.js?v=3
    type: module
  - url: /local/sumi-house/cards/sumi-hot-tub-card.js?v=1
    type: module
  - url: /local/sumi-house/cards/sumi-meal-planner.js?v=1
    type: module
